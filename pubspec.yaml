name: task_app  # KEEP AS IS - DON'T CHANGE
description: A personal offline-first task management application
publish_to: 'none'
version: 1.0.0+1
# ... rest remains same

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^0.4.0
  path_provider: ^2.1.0
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  intl: ^0.18.1
  table_calendar: ^3.0.9
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  flutter_local_notifications: ^17.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  path: ^1.9.0
  workmanager: ^0.9.0+3
  flutter_timezone: ^5.1.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
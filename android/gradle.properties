org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.incremental=false -Dkotlin.daemon.jvmargs="-Xmx4G -Dkotlin.incremental=false"
android.useAndroidX=true
